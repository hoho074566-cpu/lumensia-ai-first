name: AI-First clean-room checks

on:
  push:
    branches: [main, codex/canon-base-01-clean-reconciliation, codex/authoring-runtime-01, codex/opus-prose-pace-v1]
  pull_request:
    branches: [main, codex/v0-pure-ai-narrative, codex/canon-base-01-clean-reconciliation, codex/authoring-runtime-01]

permissions:
  contents: read

concurrency:
  group: ai-first-cleanroom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Run clean-room checks
        run: node scripts/check.mjs
      - name: Run V0 hard-invariant checks
        run: node scripts/v0.test.mjs
      - name: Run CANON-BASE-01 cross-file checks
        run: node scripts/canon-base-01.test.mjs
      - name: Run factual Canon retrieval checks
        run: node scripts/canon-retrieval.test.mjs
      - name: Run AUTHORING-RUNTIME-01 checks
        run: node scripts/authoring-runtime-01.test.mjs
