name: AI-First clean-room checks

on:
  push:
    branches: [main, codex/canon-base-01-clean-reconciliation, codex/authoring-runtime-01, codex/writer-cleanroom-01, codex/crack-runtime-01, codex/crack-runtime-02-simple, codex/chat-parity-01, codex/original-feel-golden3-v1, codex/golden3-production-default, codex/ui-original-dialogue-v1, codex/pc-status-01, codex/growth-01a, codex/relationship-01, codex/continuity-persist-01]
  pull_request:
    branches: [main, codex/v0-pure-ai-narrative, codex/canon-base-01-clean-reconciliation, codex/ui-original-dialogue-v1, codex/pc-status-01, codex/growth-01a, codex/relationship-01]

permissions:
  contents: read

concurrency:
  group: ai-first-cleanroom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Run clean-room checks
        run: node scripts/check.mjs
      - name: Run V0 hard-invariant checks
        run: node scripts/v0.test.mjs
      - name: Run CANON-BASE-01 cross-file checks
        run: node scripts/canon-base-01.test.mjs
      - name: Run factual Canon retrieval checks
        run: node scripts/canon-retrieval.test.mjs
      - name: Run Crack runtime checks
        run: node scripts/authoring-runtime-01.test.mjs
      - name: Run Chat parity matrix checks
        run: node scripts/chat-parity-01.test.mjs
      - name: Run Golden3 Writer behavior invariants
        run: node scripts/original-feel-golden3-v1.test.mjs
      - name: Run Golden3 production-default invariants
        run: node scripts/golden3-production-default.test.mjs
      - name: Run original dialogue UI invariants
        run: node scripts/original-dialogue-ui.test.mjs
      - name: Run PC status runtime invariants
        run: node scripts/pc-status-01.test.mjs
      - name: Run GROWTH-01A AI-first growth invariants
        run: node scripts/growth-01a.test.mjs
      - name: Run RELATIONSHIP-01 semantic relationship invariants
        run: node scripts/relationship-01.test.mjs
      - name: Run CONTINUITY-PERSIST semantic memory invariants
        run: node scripts/continuity-persist-01.test.mjs
      - name: Run runtime situation/growth UX invariants
        run: node scripts/runtime-ux-01.test.mjs
      - name: Run PC pressure boundary invariants
        run: node scripts/pc-pressure-boundary.test.mjs
      - name: Run PC paste-settings invariants
        run: node scripts/pc-paste-import.test.mjs
      - name: Run procedural interrogation boundary invariants
        run: node scripts/procedural-interrogation-boundary.test.mjs
