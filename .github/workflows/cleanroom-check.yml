name: AI-First clean-room checks

on:
  push:
    branches: [main, codex/v0-r2-original-grammar, codex/v0-r2a-scene-overlap, codex/v0-r2b-light-polish, codex/v0-r2c-pc-authority-guard, codex/v0-r2d-social-relationship-context, codex/v0-r2e-npc-knowledge-boundary, codex/v0-r2f-writer-semantics-rebalance, codex/v0-r3a-original-scene-grammar, codex/v0-r3b-named-cast-priority]
  pull_request:
    branches: [main, codex/v0-pure-ai-narrative, codex/v0-r2-original-grammar, codex/v0-r2a-scene-overlap, codex/v0-r2b-light-polish, codex/v0-r2c-pc-authority-guard, codex/v0-r2d-social-relationship-context, codex/v0-r2e-npc-knowledge-boundary, codex/v0-r2f-writer-semantics-rebalance, codex/v0-r3a-original-scene-grammar]

permissions:
  contents: read

concurrency:
  group: ai-first-cleanroom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Run clean-room checks
        run: node scripts/check.mjs
      - name: Run V0 hard-invariant checks
        run: node scripts/v0.test.mjs
      - name: Run V0-R2 original-grammar checks
        run: node scripts/v0-r2.test.mjs
      - name: Run V0-R2A scene-overlap checks
        run: node scripts/v0-r2a.test.mjs
      - name: Run V0-R2B light-polish checks
        run: node scripts/v0-r2b.test.mjs
      - name: Run V0-R2C PC-authority checks
        run: node scripts/v0-r2c.test.mjs
      - name: Run V0-R2D social-relationship checks
        run: node scripts/v0-r2d.test.mjs
      - name: Run V0-R2E NPC-knowledge checks
        run: node scripts/v0-r2e.test.mjs
      - name: Run V0-R2F Writer-semantics checks
        run: node scripts/v0-r2f.test.mjs
      - name: Run V0-R3A original-scene checks
        run: node scripts/v0-r3a.test.mjs
      - name: Run V0-R3B named-cast checks
        run: node scripts/v0-r3b.test.mjs
