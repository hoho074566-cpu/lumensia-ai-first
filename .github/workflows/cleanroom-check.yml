name: AI-First clean-room checks

on:
  push:
    branches: [main, codex/canon-base-01-clean-reconciliation]
  pull_request:
    branches: [main, codex/v0-pure-ai-narrative]

permissions:
  contents: read

concurrency:
  group: ai-first-cleanroom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Run clean-room checks
        run: node scripts/check.mjs
      - name: Run V0 hard-invariant checks
        run: node scripts/v0.test.mjs
      - name: Run CANON-BASE-01 cross-file checks
        run: node scripts/canon-base-01.test.mjs
      - name: Run factual Canon retrieval checks
        run: node scripts/canon-retrieval.test.mjs
