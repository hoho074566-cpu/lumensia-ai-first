<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100f13">
  <title>Lumensia AI-First V0</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">LUMENSIA</div>
      <div id="statusText" class="status">V0 · AI-First</div>
    </div>
    <nav class="toolbar" aria-label="게임 도구">
      <button id="newGameButton" type="button">새 게임</button>
      <button id="exportButton" type="button">저장</button>
      <button id="importButton" type="button">불러오기</button>
      <button id="settingsButton" type="button">설정</button>
    </nav>
  </header>

  <main id="story" class="story" aria-live="polite"></main>
  <div id="errorBox" class="error-box" hidden></div>

  <form id="composer" class="composer">
    <label class="sr-only" for="actionInput">행동 입력</label>
    <textarea id="actionInput" rows="3" maxlength="12000" placeholder="무엇을 할지 직접 입력한다. admin ... 으로 즉시 장면 테스트 가능" autocomplete="off"></textarea>
    <div class="composer-actions">
      <button id="advanceButton" class="advance-button" type="button">이어 진행</button>
      <button id="sendButton" class="send-button" type="submit">보내기</button>
    </div>
  </form>

  <input id="importInput" type="file" accept="application/json,.json" hidden>

  <dialog id="pcDialog" class="modal">
    <form id="pcForm" class="modal-form">
      <header>
        <div class="eyebrow">V0 PLAYER CHARACTER</div>
        <h1>캐릭터 생성</h1>
        <p>세계관과 충돌하지 않는 범위에서 자유롭게 만든다. 이 정보는 PC의 현재 행동이나 감정을 대신 결정하지 않는다.</p>
      </header>
      <div class="form-grid two">
        <label>이름<input name="name" required maxlength="80" placeholder="이름"></label>
        <label>나이<input name="age" required type="number" min="1" max="300" value="20"></label>
        <label>성별<input name="gender" maxlength="40" placeholder="자유 입력"></label>
        <label>학과<input name="department" maxlength="80" placeholder="기사과 / 마법과 / 신학부 등"></label>
        <label>출신<input name="origin" maxlength="180" placeholder="출신지·배경"></label>
        <label>신분<input name="socialStatus" maxlength="120" placeholder="평민 / 귀족 / 기타"></label>
        <label>입학 방식<input name="admission" maxlength="160" placeholder="일반전형 / 추천 / 특기자 등"></label>
        <label>무의 경지<input name="realm" maxlength="120" placeholder="비기너 / 익스퍼트 등"></label>
        <label>마법 써클<input name="magicCircle" type="number" min="0" max="9" placeholder="0~9"></label>
      </div>
      <fieldset>
        <legend>재능 1~10</legend>
        <div class="form-grid four">
          <label>🔮 마법<input name="talentMagic" type="number" min="1" max="10" value="5"></label>
          <label>⚔️ 무<input name="talentMartial" type="number" min="1" max="10" value="5"></label>
          <label>🌟 영혼<input name="talentSoul" type="number" min="1" max="10" value="5"></label>
          <label>📘 지식<input name="talentKnowledge" type="number" min="1" max="10" value="5"></label>
        </div>
      </fieldset>
      <label>외형<textarea name="appearance" rows="2" maxlength="700" placeholder="외형"></textarea></label>
      <label>배경 / 캐릭터 설정<textarea name="background" rows="5" maxlength="1400" placeholder="과거, 성격 경향, 가치관, 능력 제약 등을 자유롭게"></textarea></label>
      <label>초기 스킬<textarea name="skills" rows="3" placeholder="쉼표 또는 줄바꿈으로 구분"></textarea></label>
      <label>초기 장비<textarea name="equipment" rows="3" placeholder="쉼표 또는 줄바꿈으로 구분"></textarea></label>
      <button class="primary" type="submit">이 캐릭터로 시작</button>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="modal small">
    <section class="modal-form">
      <header>
        <div class="eyebrow">LOCAL SETTINGS</div>
        <h2>설정</h2>
      </header>
      <label>접속 토큰<input id="tokenInput" type="password" autocomplete="off" placeholder="Vercel LUMENSIA_ACCESS_TOKEN을 사용한다면 입력"></label>
      <p class="muted">OpenAI API 키는 앱에 입력하지 않는다. 서버 환경변수에만 둔다.</p>
      <div class="button-row">
        <button id="settingsCloseButton" type="button">닫기</button>
        <button id="settingsSaveButton" class="primary" type="button">저장</button>
      </div>
    </section>
  </dialog>

  <script type="module" src="/src/client.js"></script>
</body>
</html>
